version: '3.8'

services:
  ego-cepte:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "run", "server.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ego-cepte-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
    restart: unless-stopped
