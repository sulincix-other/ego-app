name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Bağımlılıkları kurun
      - name: Bağımlılıkları kur
        run: bun install --frozen-lockfile

      # Java ortamını kurun
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Google 404 hatasını engelleyen Android SDK kurulumu
      - name: Android SDK ortamını kurun
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'

      # Olası Gradle izin hatasını önleyin
      - name: Gradle izinlerini ayarla
        run: |
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi
          if [ -f "gradlew" ]; then chmod +x gradlew; fi

      # Derleme işlemi
      - name: APK derle
        run: bun run apk

      # Çıktıyı artifact olarak yükleyin
      - name: APK'yı yükle
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "current"
          prerelease: false
          title: "Latest release"
          files: |
            dist/*.apk
            android/app/build/outputs/apk/**/*.apk